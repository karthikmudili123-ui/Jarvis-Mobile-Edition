<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Personal AI Agent v20.0</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#020409">
    <link rel="apple-touch-icon" href="./icon.svg">

    <style>
        :root { --c: #00f0ff; --o: #ffa500; --g: #2bff88; --r: #ff5555; --p: #b48cff; }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background: radial-gradient(ellipse at 50% 0%, #0d1b2e 0%, #05080f 60%, #020409 100%);
            background-attachment: fixed;
            color: var(--c);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 15px 10px 40px;
            text-align: center;
        }
        /* HUD elements & reactor canvas */
        .wrap { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; }
        h1 { margin: 4px 0 0; font-size: 36px; letter-spacing: .25em; text-shadow: 0 0 10px var(--c); }
        .reactor-box { margin: 15px auto; width: 220px; height: 220px; cursor: pointer; }
        canvas { display: block; margin: 0 auto; filter: drop-shadow(0 0 20px var(--c)); }
        
        .panel {
            position: relative; margin: 15px 0; padding: 18px;
            border: 1px solid rgba(0,240,255,.35);
            background: rgba(5,12,22,.85);
            text-align: left;
        }
        input, select { width: 100%; padding: 12px; background: #07111c; color: var(--c); border: 1px solid var(--c); margin-top: 5px; }
        
        button { padding: 10px 15px; margin: 5px; cursor: pointer; background: transparent; color: var(--c); border: 1px solid var(--c); font-weight: bold; }
        button.active { background: var(--c); color: #020409; }
        
        #log { height: 250px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-top: 10px; font-size: 14px; text-align: left; }
        .msg { margin-bottom: 10px; border-left: 2px solid var(--c); padding-left: 8px; }
        .msg.user { color: #7fdcff; border-left-color: #7fdcff; }
        .msg.jarvis { color: #fff; }
    </style>
</head>
<body data-state="idle">
    <div class="wrap">
        <h1>J.A.R.V.I.S.</h1>
        <div class="reactor-box" onclick="toggleWakeWord()" title="Toggle Passive Listening">
            <canvas id="reactor"></canvas>
        </div>
        <p id="stateLabel">STANDBY</p>

        <div class="panel">
            <input type="password" id="apiKey" placeholder="Enter Groq API Key">
            <select id="model"><option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option></select>
            <input type="text" id="prompt" placeholder="Say 'Jarvis' or type command...">
            <div class="row">
                <button onclick="sendToJarvis()">Send</button>
                <button id="micBtn" onclick="toggleMic()">🎤 Speak</button>
                <button id="wakeBtn" onclick="toggleWakeWord()">⚡ Wake Word: OFF</button>
            </div>
        </div>

        <div class="panel" id="log"></div>
    </div>

    <script>
        const API = 'https://api.groq.com/openai/v1';
        const $ = id => document.getElementById(id);
        let state = 'idle';

        function setState(s) { state = s; document.body.dataset.state = s; $('stateLabel').textContent = s.toUpperCase(); }

        // Reactor Animation
        const cv = $('reactor'); const ctx = cv.getContext('2d');
        function draw() {
            ctx.clearRect(0,0,220,220);
            ctx.beginPath(); ctx.arc(110,110, 80, 0, Math.PI*2);
            ctx.strokeStyle = '#00f0ff'; ctx.stroke();
            requestAnimationFrame(draw);
        }
        draw();

        function addMsg(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = role.toUpperCase() + ': ' + text;
            $('log').appendChild(div);
        }

        function speak(text) {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'te-IN';
            speechSynthesis.speak(u);
        }

        async function sendToJarvis() {
            const prompt = $('prompt').value;
            addMsg('user', prompt);
            $('prompt').value = '';
            setState('thinking');
            
            // Local Commands Logic (Time, Weather, etc.)
            if(prompt.includes('time')) {
                const t = new Date().toLocaleTimeString();
                addMsg('jarvis', 'Time is ' + t);
                speak('Time is ' + t);
            } else {
                // Groq API Call
                addMsg('jarvis', 'Processing...');
                speak('Processing, Boss.');
            }
            setState('idle');
        }

        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        function toggleMic() {
            const rec = new SR();
            rec.onresult = e => { $('prompt').value = e.results[0][0].transcript; sendToJarvis(); };
            rec.start();
        }

        function toggleWakeWord() {
            // Wake Word Logic
        }
    </script>
</body>
</html>
