<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Groq Online v17.0 (PWA)</title>

    <!-- Phase 9: PWA Manifest & Meta -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#020409">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./icon.svg">

    <style>
        :root { --c: #00f0ff; --o: #ffa500; --g: #2bff88; --r: #ff5555; --p: #b48cff; }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            background: radial-gradient(ellipse at 50% 0%, #0d1b2e 0%, #05080f 60%, #020409 100%);
            background-attachment: fixed;
            color: var(--c);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 18px 12px 40px;
            text-align: center;
        }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background-image:
                linear-gradient(rgba(0,240,255,.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,240,255,.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        body::after {
            content: ''; position: fixed; inset: 0; z-index: 5; pointer-events: none;
            background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.14) 3px);
        }
        .wrap { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; }
        h1 {
            margin: 6px 0 0; font-size: clamp(26px, 7vw, 38px); letter-spacing: .28em;
            text-shadow: 0 0 8px var(--c), 0 0 24px rgba(0,240,255,.6);
        }
        .sub { font-size: 12px; letter-spacing: .5em; opacity: .75; margin-top: 4px; }
        .reactor-box { margin: 10px auto 0; width: 220px; height: 220px; }
        canvas { display: block; margin: 0 auto; }
        .hud-row { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; margin: 6px 0 4px; }
        .hud-row div { border: 1px solid rgba(0,240,255,.3); background: rgba(5,12,22,.7); padding: 6px 4px; min-width: 0; }
        .hud-row span { display: block; font-size: 10px; letter-spacing: .2em; opacity: .6; }
        .hud-row b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 6px currentColor; }
        body[data-state="listening"] #stateLabel { color: var(--o); }
        body[data-state="thinking"] #stateLabel { color: #8cdcff; }
        body[data-state="speaking"] #stateLabel { color: var(--g); }
        .status { font-size: 12px; margin: 8px 0 0; opacity: .85; }
        .status::before { content: '\25CF '; color: var(--g); animation: blink 1.6s infinite; }
        @keyframes blink { 50% { opacity: .25; } }
        .panel {
            position: relative; margin: 14px 0; padding: 16px;
            border: 1px solid rgba(0,240,255,.35);
            background: rgba(5,12,22,.72);
            box-shadow: inset 0 0 18px rgba(0,240,255,.1), 0 0 14px rgba(0,240,255,.08);
        }
        .panel::before, .panel::after { content: ''; position: absolute; width: 16px; height: 16px; border: 2px solid var(--c); }
        .panel::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .panel::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
        label { display: block; font-size: 11px; letter-spacing: .2em; opacity: .7; margin: 8px 0 3px; text-align: left; }
        input, select {
            width: 100%; padding: 12px; background: #07111c; color: var(--c);
            border: 1px solid var(--c); font-family: inherit; font-size: 14px; border-radius: 0;
        }
        input:focus, select:focus { outline: none; box-shadow: 0 0 10px var(--c); }
        input::placeholder { color: rgba(0,240,255,.45); }
        .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin-top: 10px; }
        .row.voice { flex-wrap: nowrap; margin-top: 0; }
        .row.voice select { flex: 1; min-width: 0; }
        button {
            padding: 11px 16px; background: rgba(0,0,0,.5); color: var(--c); border: 1px solid var(--c);
            font-family: inherit; font-weight: bold; font-size: 14px; cursor: pointer; border-radius: 0;
            text-shadow: 0 0 6px currentColor; transition: background .15s, box-shadow .15s;
        }
        button:hover { background: rgba(0,240,255,.15); box-shadow: 0 0 12px currentColor; }
        button:active { transform: scale(.97); }
        button:disabled { opacity: .5; cursor: wait; }
        #micBtn { color: var(--o); border-color: var(--o); }
        #voiceBtn { color: var(--g); border-color: var(--g); }
        #sfxBtn { color: var(--p); border-color: var(--p); }
        #clearBtn { color: var(--r); border-color: var(--r); }
        #micBtn.active { background: var(--o); color: #05070c; text-shadow: none; }
        #testBtn { flex: none; }
        .panel h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .3em; opacity: .8; text-align: left; }
        #log { text-align: left; max-height: 46vh; overflow-y: auto; padding-right: 4px; }
        #log::-webkit-scrollbar { width: 6px; }
        #log::-webkit-scrollbar-thumb { background: rgba(0,240,255,.4); }
        .msg { white-space: pre-wrap; margin: 0 0 12px; padding-left: 10px; line-height: 1.45; border-left: 2px solid var(--c); font-size: 14px; }
        .msg.user { color: #7fdcff; border-left-color: #7fdcff; }
        .msg.jarvis { color: #fff; }
        .msg.sys { color: rgba(0,240,255,.7); border-left-color: rgba(0,240,255,.3); font-size: 12px; }
        .msg .who { color: var(--c); font-weight: bold; font-size: 11px; letter-spacing: .2em; display: block; margin-bottom: 2px; }
        .msg a { color: var(--g); }
    </style>
</head>
<body data-state="idle">
    <div class="wrap">
        <h1>J.A.R.V.I.S.</h1>
        <div class="sub">GROQ ONLINE (v17.0 PWA)</div>

        <div class="reactor-box"><canvas id="reactor"></canvas></div>

        <div class="hud-row">
            <div><span>TIME</span><b id="clock">--:--:--</b></div>
            <div><span>STATE</span><b id="stateLabel">STANDBY</b></div>
            <div><span>MODEL</span><b id="modelLabel">--</b></div>
        </div>
        <p class="status">Status: <span id="status">Ready (v17.0 - PWA & Weather Active)</span></p>

        <div class="panel">
            <input type="password" id="apiKey" placeholder="Enter Groq API Key (gsk_...)">
            <label for="model">AI MODEL</label>
            <select id="model"><option value="">Models load after you enter your key</option></select>
            <label for="voiceSel">JARVIS VOICE</label>
            <div class="row voice">
                <select id="voiceSel"><option value="">Loading voices...</option></select>
                <button id="testBtn" onclick="testVoice()">🔈 Test</button>
            </div>
            <label for="prompt">COMMAND</label>
            <input type="text" id="prompt" placeholder="Ask Jarvis anything... (say 'help' for commands)">

            <div class="row">
                <button id="sendBtn" onclick="sendToJarvis()">Send</button>
                <button id="micBtn" onclick="toggleMic()">🎤 Speak</button>
                <button id="voiceBtn" onclick="toggleVoice()">🔊 Voice: ON</button>
                <button id="sfxBtn" onclick="toggleSfx()">🔔 SFX: ON</button>
                <button id="clearBtn" onclick="clearChat()">🗑 Clear</button>
            </div>
        </div>

        <div class="panel">
            <h3>CONVERSATION LOG</h3>
            <div id="log"></div>
        </div>
    </div>

    <script>
        const API = 'https://api.groq.com/openai/v1';
        const PREFERRED = ['llama-3.3-70b-versatile', 'openai/gpt-oss-120b', 'openai/gpt-oss-20b', 'llama-3.1-8b-instant', 'qwen', 'kimi', 'compound'];
        const NON_CHAT = /whisper|guard|safeguard|moderation|classif|tts|orpheus|embed|playai|transcri|allam/i;
        const SYSTEM_PROMPT = 'You are J.A.R.V.I.S., a witty, helpful AI assistant. Always reply in English unless the user explicitly asks for another language. Keep answers concise, because replies may be spoken aloud.';
        const MAX_MESSAGES = 20;

        const SITES = {
            'youtube': 'https://www.youtube.com',
            'google': 'https://www.google.com',
            'whatsapp': 'https://wa.me/',
            'github': 'https://github.com',
            'spotify': 'https://open.spotify.com'
        };

        const $ = id => document.getElementById(id);
        let models = [];
        let history = [];

        function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

        function rank(id) {
            let i = PREFERRED.indexOf(id);
            if (i !== -1) return i;
            i = PREFERRED.findIndex(p => id.includes(p));
            return i === -1 ? 99 : i + 0.5;
        }

        const STATE_NAMES = { idle: 'STANDBY', listening: 'LISTENING', thinking: 'PROCESSING', speaking: 'SPEAKING' };
        let state = 'idle';

        function setState(s) {
            state = s;
            document.body.dataset.state = s;
            $('stateLabel').textContent = STATE_NAMES[s] || s.toUpperCase();
        }

        function updateModelLabel() {
            $('modelLabel').textContent = $('model').value || '--';
        }

        function tickClock() {
            $('clock').textContent = new Date().toLocaleTimeString('en-GB');
        }
        tickClock();
        setInterval(tickClock, 1000);

        let sfxOn = load('jarvis_sfx') !== 'off';
        let actx = null;
        function tone(freq, dur, type, gain, delay) {
            if (!sfxOn) return;
            try {
                if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
                if (actx.state === 'suspended') actx.resume();
                const t = actx.currentTime + (delay || 0);
                const o = actx.createOscillator();
                const g = actx.createGain();
                o.type = type || 'sine';
                o.frequency.setValueAtTime(freq, t);
                g.gain.setValueAtTime(0.0001, t);
                g.gain.exponentialRampToValueAtTime(gain || 0.05, t + 0.01);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                o.connect(g); g.connect(actx.destination);
                o.start(t); o.stop(t + dur + 0.02);
            } catch (e) {}
        }
        const sfx = {
            click() { tone(1000, 0.04, 'square', 0.02); },
            send() { tone(880, 0.08, 'square', 0.03); tone(1320, 0.08, 'square', 0.03, 0.07); },
            recv() { tone(660, 0.1, 'sine', 0.05); tone(990, 0.14, 'sine', 0.05, 0.1); },
            mic() { tone(520, 0.1, 'triangle', 0.06); tone(780, 0.12, 'triangle', 0.06, 0.09); },
            err() { tone(180, 0.25, 'sawtooth', 0.04); }
        };
        function toggleSfx() {
            sfxOn = !sfxOn;
            store('jarvis_sfx', sfxOn ? 'on' : 'off');
            renderSfxBtn();
        }
        function renderSfxBtn() { $('sfxBtn').textContent = sfxOn ? '🔔 SFX: ON' : '🔕 SFX: OFF'; }
        renderSfxBtn();

        const cv = $('reactor');
        const ctx = cv.getContext('2d');
        const SIZE = 220;
        function fitCanvas() {
            const d = window.devicePixelRatio || 1;
            cv.width = SIZE * d; cv.height = SIZE * d;
            cv.style.width = SIZE + 'px'; cv.style.height = SIZE + 'px';
            ctx.setTransform(d, 0, 0, d, 0, 0);
        }
        fitCanvas();

        const STATE_COLORS = { idle: [0, 240, 255], listening: [255, 165, 0], thinking: [140, 220, 255], speaking: [43, 255, 136] };
        const STATE_SPEED = { idle: 1, listening: 1.8, thinking: 4, speaking: 1.5 };
        let curColor = [0, 240, 255], curSpeed = 1, angle = 0, lastT = 0;

        function rgba(a) {
            return 'rgba(' + Math.round(curColor[0]) + ',' + Math.round(curColor[1]) + ',' + Math.round(curColor[2]) + ',' + a + ')';
        }

        function drawReactor(pulse) {
            const c = SIZE / 2;
            ctx.clearRect(0, 0, SIZE, SIZE);
            ctx.save(); ctx.translate(c, c);
            ctx.strokeStyle = rgba(0.5); ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(0, 0, 100, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
        }

        function reactorFrame(now) {
            const dt = Math.min(0.05, ((now - lastT) / 1000) || 0.016);
            lastT = now;
            const tc = STATE_COLORS[state] || STATE_COLORS.idle;
            for (let i = 0; i < 3; i++) curColor[i] += (tc[i] - curColor[i]) * 0.08;
            angle += dt * (STATE_SPEED[state] || 1);
            drawReactor(0.5 + 0.5 * Math.sin(now / 300));
            requestAnimationFrame(reactorFrame);
        }
        requestAnimationFrame(reactorFrame);

        function typeInto(el, text) {
            el.textContent = text;
        }

        function addMsg(role, text) {
            const log = $('log');
            const div = document.createElement('div');
            div.className = 'msg ' + (role === 'user' ? 'user' : role === 'system' ? 'sys' : 'jarvis');
            div.textContent = (role.toUpperCase() + ': ') + text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
            return div;
        }

        function clearChat() {
            history = [];
            $('log').innerHTML = '';
            addMsg('system', 'Memory cleared.');
        }

        function respond(userText, reply) {
            addMsg('user', userText);
            addMsg('assistant', reply);
            speak(reply);
            return true;
        }

        function handleCommand(raw) {
            const c = raw.toLowerCase().trim();
            if (c === 'time') {
                return respond(raw, 'It is ' + new Date().toLocaleTimeString());
            }
            if (c === 'date') {
                return respond(raw, 'Today is ' + new Date().toLocaleDateString());
            }
            if (c === 'weather') {
                addMsg('user', raw);
                const out = addMsg('assistant', 'Fetching live weather...');
                fetch("https://api.open-meteo.com/v1/forecast?latitude=17.3850&longitude=78.4867&current_weather=true")
                    .then(res => res.json())
                    .then(data => {
                        const temp = data.current_weather.temperature;
                        const msg = `Temperature is ${temp}°C, Boss.`;
                        out.textContent = msg;
                        speak(msg);
                    }).catch(() => { out.textContent = 'Weather fetch failed.'; });
                return true;
            }
            return false;
        }

        async function sendToJarvis() {
            const prompt = $('prompt').value.trim();
            if (!prompt) return;
            if (handleCommand(prompt)) { $('prompt').value = ''; return; }
            addMsg('user', prompt);
            $('prompt').value = '';
            addMsg('assistant', 'Processing AI command...');
        }

        const hasTTS = 'speechSynthesis' in window;
        function speak(text) {
            if (!hasTTS) return;
            const u = new SpeechSynthesisUtterance(text);
            speechSynthesis.speak(u);
        }
        function testVoice() { speak('JARVIS voice online.'); }

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
