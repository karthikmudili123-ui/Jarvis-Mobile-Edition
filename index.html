<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Groq Online v14</title>
    <style>
        body { background-color: #0b0f19; color: #00f0ff; font-family: monospace; text-align: center; padding: 20px; }
        input, select, button { padding: 10px; margin: 8px; background: #111; color: #00f0ff; border: 2px solid #00f0ff; font-family: monospace; width: 85%; max-width: 400px; }
        button { cursor: pointer; font-weight: bold; width: auto; padding: 10px 15px; }
        .btn-group { display: flex; justify-content: center; gap: 5px; flex-wrap: wrap; }
        #chat-container { text-align: left; background: #05070c; padding: 15px; border: 1px solid #00f0ff; margin: 20px auto; border-radius: 5px; max-width: 400px; height: 300px; overflow-y: auto; white-space: pre-wrap; color: #fff; }
        .user-msg { color: #00f0ff; margin-bottom: 8px; }
        .jarvis-msg { color: #00ffaa; margin-bottom: 8px; }
    </style>
</head>
<body>
    <h1>J.A.R.V.I.S. - Groq Online</h1>
    <p>Status: <span id="status">Loading models...</span></p>
    
    <input type="password" id="apiKey" placeholder="Enter Groq API Key (gsk_...)" onchange="fetchModels()"><br>
    <select id="modelSelect"><option value="">Enter API Key above first</option></select><br>
    <input type="text" id="prompt" placeholder="Ask Jarvis anything..." onkeypress="if(event.key==='Enter') sendToJarvis()"><br>
    
    <div class="btn-group">
        <button onclick="sendToJarvis()">Send</button>
        <button id="micBtn" onclick="toggleVoiceInput()" style="border-color: #ffaa00; color: #ffaa00;">🎤 Speak</button>
        <button id="voiceToggleBtn" onclick="toggleVoiceOutput()" style="border-color: #00ffaa; color: #00ffaa;">🔊 Voice: ON</button>
        <button onclick="clearChat()" style="border-color: #ff5555; color: #ff5555;">🗑 Clear</button>
    </div>
    
    <h3>Conversation:</h3>
    <div id="chat-container">Awaiting input...</div>

    <script>
        let chatHistory = [];
        let recognition;
        let isListening = false;
        let voiceEnabled = true;
        let selectedVoice = null;

        // Load Voices properly
        function loadVoices() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            // Try to find a good deep male English voice
            selectedVoice = voices.find(v => (v.name.includes('Male') || v.name.includes('David') || v.name.includes('George') || v.name.includes('Mark') || v.name.includes('Google UK English Male') || v.name.includes('Oliver')) && v.lang.startsWith('en')) || voices.find(v => v.lang.startsWith('en')) || voices[0];
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        // Speech Recognition Setup
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                document.getElementById('prompt').value = speechToText;
                document.getElementById('micBtn').innerText = "🎤 Speak";
                isListening = false;
                sendToJarvis();
            };
            recognition.onerror = () => { document.getElementById('micBtn').innerText = "🎤 Speak"; isListening = false; };
            recognition.onend = () => { document.getElementById('micBtn').innerText = "🎤 Speak"; isListening = false; };
        }

        function toggleVoiceInput() {
            if (!recognition) {
                alert("Speech recognition not supported on this browser!");
                return;
            }
            if (isListening) {
                recognition.stop();
                isListening = false;
                document.getElementById('micBtn').innerText = "🎤 Speak";
            } else {
                recognition.start();
                isListening = true;
                document.getElementById('micBtn').innerText = "🔴 Listening...";
            }
        }

        function toggleVoiceOutput() {
            voiceEnabled = !voiceEnabled;
            const btn = document.getElementById('voiceToggleBtn');
            btn.innerText = voiceEnabled ? "🔊 Voice: ON" : "🔇 Voice: OFF";
            btn.style.borderColor = voiceEnabled ? "#00ffaa" : "#ff5555";
            btn.style.color = voiceEnabled ? "#00ffaa" : "#ff5555";
            if(!voiceEnabled) window.speechSynthesis.cancel();
        }

        function speakText(text) {
            if (!voiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            
            const cleanText = text.replace(/```[\s\S]*?```/g, " code block provided. ").replace(/[*_#`]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }
            utterance.rate = 1.0;
            utterance.pitch = 0.5; // Deeper robotic tone
            window.speechSynthesis.speak(utterance);
        }

        async function fetchModels() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const statusBox = document.getElementById('status');
            const selectBox = document.getElementById('modelSelect');
            
            if(!apiKey) return;
            
            statusBox.innerText = "Fetching models...";
            try {
                const response = await fetch('https://api.groq.com/openai/v1/models', {
                    headers: { 'Authorization': `Bearer ${apiKey}` }
                });
                const data = await response.json();
                
                if(data.data && data.data.length > 0) {
                    selectBox.innerHTML = '';
                    // Exclude guard/embedding models, keep chat models only
                    const chatModels = data.data.filter(m => !m.id.includes('guard') && !m.id.includes('embed') && (m.id.includes('llama') || m.id.includes('gemma') || m.id.includes('gpt') || m.id.includes('mixtral')));
                    const modelsToUse = chatModels.length > 0 ? chatModels : data.data;
                    
                    modelsToUse.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.id;
                        opt.innerText = m.id;
                        selectBox.appendChild(opt);
                    });
                    statusBox.innerText = `Ready (v14.0) - ${modelsToUse.length} models`;
                } else {
                    statusBox.innerText = "Ready (v14.0)";
                    selectBox.innerHTML = '<option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>';
                }
            } catch(e) {
                statusBox.innerText = "Ready (v14.0)";
                selectBox.innerHTML = '<option value="llama-3.1-8b-instant">llama-3.1-8b-instant</option>';
            }
        }

        async function sendToJarvis() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const model = document.getElementById('modelSelect').value || "llama-3.1-8b-instant";
            const chatBox = document.getElementById('chat-container');
            
            if(!apiKey) {
                alert("Please enter your Groq API Key first, Boss!");
                return;
            }
            if(!prompt) {
                alert("Please type or speak a prompt!");
                return;
            }
            
            if(chatBox.innerText === "Awaiting input...") chatBox.innerText = "";
            
            chatBox.innerHTML += `<div class="user-msg"><b>You:</b> ${prompt}</div>`;
            chatHistory.push({ role: "user", content: prompt });
            document.getElementById('prompt'].value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
            
            chatBox.innerHTML += `<div id="thinking" class="jarvis-msg"><b>JARVIS:</b> Thinking...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
            
            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: chatHistory
                    })
                });
                
                const data = await response.json();
                document.getElementById('thinking').remove();
                
                if(data.choices && data.choices[0]?.message?.content) {
                    const reply = data.choices[0].message.content;
                    chatBox.innerHTML += `<div class="jarvis-msg"><b>JARVIS:</b> ${reply}</div>`;
                    chatHistory.push({ role: "assistant", content: reply });
                    speakText(reply);
                } else if(data.error) {
                    chatBox.innerHTML += `<div class="jarvis-msg" style="color:#ff5555;"><b>API Error:</b> ${data.error.message}</div>`;
                } else {
                    chatBox.innerHTML += `<div class="jarvis-msg"><b>Response:</b> ${JSON.stringify(data)}</div>`;
                }
            } catch (error) {
                document.getElementById('thinking')?.remove();
                chatBox.innerHTML += `<div class="jarvis-msg" style="color:#ff5555;"><b>Network Error:</b> ${error.message}</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function clearChat() {
            chatHistory = [];
            window.speechSynthesis.cancel();
            document.getElementById('chat-container').innerText = "Awaiting input...";
        }
    </script>
</body>
</html>
