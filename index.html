
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Brain Online</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f19;
            color: #00f0ff;
            font-family: monospace;
            text-align: center;
            padding: 50px 15px;
            margin: 0;
        }

        h1 {
            font-size: clamp(25px, 6vw, 42px);
        }

        input, button {
            padding: 15px;
            margin: 10px auto;
            background: #111;
            color: #00f0ff;
            border: 2px solid #00f0ff;
            font-family: monospace;
            font-size: 16px;
            width: 100%;
            max-width: 500px;
        }

        button {
            cursor: pointer;
            width: auto;
            padding: 15px 25px;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #response {
            color: white;
            max-width: 600px;
            margin: 20px auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            text-align: left;
            line-height: 1.6;
        }

        #status {
            color: #00f0ff;
        }
    </style>
</head>

<body>

    <h1>J.A.R.V.I.S. - Brain Online</h1>

    <p>Status: <span id="status">Ready</span></p>

    <input
        type="password"
        id="apiKey"
        placeholder="Enter Gemini API Key"
        autocomplete="off"
    >

    <br>

    <input
        type="text"
        id="prompt"
        placeholder="Ask Jarvis anything..."
    >

    <br>

    <button id="sendButton" onclick="sendToJarvis()">
        Send Request
    </button>

    <h2>Response:</h2>

    <div id="response">Waiting for your command, Boss.</div>

    <script>

        // CURRENT GEMINI MODEL
        const MODEL = "gemini-3.8-flash";

        // GEMINI API FUNCTION
        async function sendToJarvis() {

            const apiKey =
                document.getElementById("apiKey").value.trim();

            const prompt =
                document.getElementById("prompt").value.trim();

            const resBox =
                document.getElementById("response");

            const status =
                document.getElementById("status");

            const button =
                document.getElementById("sendButton");

            // CHECK API KEY
            if (!apiKey) {
                alert("Please enter your Gemini API Key, Boss!");
                return;
            }

            // CHECK USER PROMPT
            if (!prompt) {
                alert("Please enter your command, Boss!");
                return;
            }

            // LOADING STATUS
            status.innerText = "Processing...";
            resBox.innerText = "JARVIS is thinking...";
            button.disabled = true;

            try {

                // CORRECT GEMINI API ENDPOINT
                const url =
                    `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;

                const response = await fetch(url, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "x-goog-api-key": apiKey
                    },

                    body: JSON.stringify({

                        contents: [
                            {
                                role: "user",
                                parts: [
                                    {
                                        text: prompt
                                    }
                                ]
                            }
                        ],

                        generationConfig: {
                            temperature: 0.7,
                            maxOutputTokens: 2048
                        }

                    })

                });

                const data = await response.json();

                // CHECK API ERRORS
                if (!response.ok) {

                    const errorMessage =
                        data.error?.message ||
                        "Unknown Gemini API error";

                    throw new Error(
                        `API Error (${response.status}): ${errorMessage}`
                    );
                }

                // EXTRACT GEMINI RESPONSE
                const reply =
                    data.candidates?.[0]?.content?.parts
                        ?.map(part => part.text || "")
                        .join("\n");

                if (reply) {

                    resBox.innerText = reply;
                    status.innerText = "Online - Ready";

                } else {

                    const reason =
                        data.candidates?.[0]?.finishReason;

                    throw new Error(
                        reason
                            ? `No text generated. Finish reason: ${reason}`
                            : "Gemini returned an empty response."
                    );
                }

            }

            catch (error) {

                resBox.innerText = error.message;
                status.innerText = "Error - Check Connection";

                console.error("JARVIS Error:", error);

            }

            finally {

                button.disabled = false;

            }

        }

        // ENTER KEY SUPPORT
        document.getElementById("prompt")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    sendToJarvis();
                }

            });

    </script>

</body>
</html>
