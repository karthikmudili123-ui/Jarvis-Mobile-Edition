<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Groq Online v9</title>
    <style>
        body { background-color: #0b0f19; color: #00f0ff; font-family: monospace; text-align: center; padding: 30px; }
        input, button, select { padding: 12px; margin: 10px; background: #111; color: #00f0ff; border: 2px solid #00f0ff; font-family: monospace; width: 80%; max-width: 400px; }
        button { cursor: pointer; font-weight: bold; width: auto; padding: 12px 25px; }
        button:disabled { opacity: 0.5; cursor: wait; }
        #response { text-align: left; background: #05070c; padding: 15px; border: 1px solid #00f0ff; margin: 20px auto 0; border-radius: 5px; white-space: pre-wrap; color: #fff; max-width: 400px; }
    </style>
</head>
<body>
    <h1>J.A.R.V.I.S. - Groq Online</h1>
    <p>Status: <span id="status">Ready (v9.0)</span></p>

    <input type="password" id="apiKey" placeholder="Enter Groq API Key (gsk_...)"><br>
    <select id="model"><option value="">Models load after you enter your key</option></select><br>
    <input type="text" id="prompt" placeholder="Ask Jarvis anything..."><br>
    <button id="sendBtn" onclick="sendToJarvis()">Send Request</button>

    <h3>Response:</h3>
    <div id="response">Awaiting input...</div>

    <script>
        const API = 'https://api.groq.com/openai/v1';
        // Preferred models, tried first if your key can access them. Order = priority.
        const PREFERRED = ['llama-3.3-70b-versatile', 'openai/gpt-oss-120b', 'openai/gpt-oss-20b', 'llama-3.1-8b-instant', 'qwen', 'kimi', 'compound'];
        // Skip non-chat models (speech, safety classifiers, etc.) and Arabic-only models
        const NON_CHAT = /whisper|guard|tts|orpheus|embed|playai|transcri|allam/i;
        const SYSTEM_PROMPT = 'You are J.A.R.V.I.S., a helpful assistant. Always reply in English unless the user explicitly asks for another language.';

        // Rank: exact match in PREFERRED first, then partial match, then everything else
        function rank(id) {
            let i = PREFERRED.indexOf(id);
            if (i !== -1) return i;
            i = PREFERRED.findIndex(p => id.includes(p));
            return i === -1 ? 99 : i + 0.5;
        }

        const $ = id => document.getElementById(id);
        let models = [];

        function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

        async function loadModels() {
            const apiKey = $('apiKey').value.trim();
            if (!apiKey) return;
            $('status').innerText = 'Loading models...';
            try {
                const r = await fetch(`${API}/models`, { headers: { Authorization: `Bearer ${apiKey}` } });
                const data = await r.json();
                if (!r.ok) throw new Error(data.error?.message || 'Could not load models');

                models = (data.data || [])
                    .filter(m => m.active !== false && !NON_CHAT.test(m.id))
                    .map(m => m.id)
                    .sort((a, b) => (rank(a) - rank(b)) || a.localeCompare(b));

                if (!models.length) throw new Error('No chat models available for this key');

                const saved = load('jarvis_model');
                const sel = $('model');
                sel.innerHTML = models.map(m => `<option value="${m}">${m}</option>`).join('');
                sel.value = models.includes(saved) ? saved : models[0];
                $('status').innerText = `Ready (v9.0) - ${models.length} models`;
            } catch (e) {
                $('status').innerText = 'Model load failed';
                $('response').innerText = 'Could not load models: ' + e.message;
            }
        }

        async function callModel(apiKey, model, prompt) {
            const r = await fetch(`${API}/chat/completions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${apiKey}` },
                body: JSON.stringify({
                    model,
                    messages: [
                        { role: 'system', content: SYSTEM_PROMPT },
                        { role: 'user', content: prompt }
                    ]
                })
            });
            return r.json();
        }

        function isModelError(data) {
            const e = data.error || {};
            return e.code === 'model_not_found' || e.code === 'model_decommissioned' ||
                   /does not exist|decommissioned|no access|not found/i.test(e.message || '');
        }

        async function sendToJarvis() {
            const apiKey = $('apiKey').value.trim();
            const prompt = $('prompt').value.trim();
            const resBox = $('response');
            const btn = $('sendBtn');

            if (!apiKey) { alert('Please enter your Groq API Key first, Boss!'); return; }
            if (!prompt) { alert('Please type a prompt for Jarvis!'); return; }

            btn.disabled = true;
            resBox.innerText = 'Thinking...';

            try {
                if (!models.length) await loadModels();
                if (!models.length) { btn.disabled = false; return; }

                // Try the selected model first, then fall back to others (max 4 attempts)
                const chosen = $('model').value;
                const queue = [chosen, ...models.filter(m => m !== chosen)].slice(0, 4);

                let lastError = 'Unknown error';
                for (const model of queue) {
                    const data = await callModel(apiKey, model, prompt);
                    const text = data.choices?.[0]?.message?.content;
                    if (text) {
                        store('jarvis_model', model);
                        $('model').value = model;
                        resBox.innerText = text;
                        return;
                    }
                    lastError = data.error?.message || JSON.stringify(data, null, 2);
                    if (!isModelError(data)) break; // key/rate-limit/etc: retrying other models won't help
                    resBox.innerText = `Model ${model} unavailable, trying another...`;
                }
                resBox.innerText = 'API Error: ' + lastError;
            } catch (err) {
                resBox.innerText = 'Network Error: ' + err.message;
            } finally {
                btn.disabled = false;
            }
        }

        $('apiKey').addEventListener('change', loadModels);
        $('apiKey').addEventListener('paste', () => setTimeout(loadModels, 50));
    </script>
</body>
</html>
