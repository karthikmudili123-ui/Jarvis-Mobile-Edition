<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Groq Online v14</title>
    <style>
        body { background-color: #0b0f19; color: #00f0ff; font-family: monospace; text-align: center; padding: 30px 15px; }
        input, button, select { padding: 12px; margin: 6px; background: #111; color: #00f0ff; border: 2px solid #00f0ff; font-family: monospace; width: 90%; max-width: 480px; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; width: auto; padding: 12px 18px; }
        button:disabled { opacity: 0.5; cursor: wait; }
        #micBtn { color: #ffa500; border-color: #ffa500; }
        #voiceBtn { color: #2bff88; border-color: #2bff88; }
        #clearBtn { color: #ff5555; border-color: #ff5555; }
        #micBtn.active { background: #ffa500; color: #05070c; }
        #testBtn { padding: 10px 14px; }
        #log { text-align: left; background: #05070c; padding: 12px; border: 1px solid #00f0ff; margin: 20px auto 0; border-radius: 5px; max-width: 520px; max-height: 50vh; overflow-y: auto; }
        .msg { white-space: pre-wrap; margin: 0 0 12px; line-height: 1.4; }
        .msg.user { color: #7fdcff; }
        .msg.jarvis { color: #fff; }
        .msg .who { color: #00f0ff; font-weight: bold; display: block; margin-bottom: 2px; }
        .row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; }
        label { font-size: 13px; opacity: 0.8; }
    </style>
</head>
<body>
    <h1>J.A.R.V.I.S. - Groq Online</h1>
    <p>Status: <span id="status">Ready (v14.0)</span></p>

    <input type="password" id="apiKey" placeholder="Enter Groq API Key (gsk_...)"><br>
    <label for="model">AI Model</label><br>
    <select id="model"><option value="">Models load after you enter your key</option></select><br>
    <label for="voiceSel">Jarvis Voice</label><br>
    <div class="row">
        <select id="voiceSel" style="width:70%"><option value="">Loading voices...</option></select>
        <button id="testBtn" onclick="testVoice()">🔈 Test</button>
    </div>
    <input type="text" id="prompt" placeholder="Ask Jarvis anything..."><br>

    <div class="row">
        <button id="sendBtn" onclick="sendToJarvis()">Send</button>
        <button id="micBtn" onclick="toggleMic()">🎤 Speak</button>
        <button id="voiceBtn" onclick="toggleVoice()">🔊 Voice: ON</button>
        <button id="clearBtn" onclick="clearChat()">🗑 Clear</button>
    </div>

    <h3>Conversation:</h3>
    <div id="log"><div class="msg jarvis"><span class="who">JARVIS</span>Awaiting input...</div></div>

    <script>
        const API = 'https://api.groq.com/openai/v1';
        const PREFERRED = ['llama-3.3-70b-versatile', 'openai/gpt-oss-120b', 'openai/gpt-oss-20b', 'llama-3.1-8b-instant', 'qwen', 'kimi', 'compound'];
        // Skip everything that is not a normal chat model:
        // speech, safety classifiers (prompt-guard, safeguard, guard), TTS, embeddings, Arabic-only, etc.
        const NON_CHAT = /whisper|guard|safeguard|moderation|classif|tts|orpheus|embed|playai|transcri|allam/i;
        const SYSTEM_PROMPT = 'You are J.A.R.V.I.S., a witty, helpful AI assistant. Always reply in English unless the user explicitly asks for another language. Keep answers concise, because replies may be spoken aloud.';
        const MAX_MESSAGES = 20; // how many past messages Jarvis remembers

        const $ = id => document.getElementById(id);
        let models = [];
        let history = []; // [{role:'user'|'assistant', content:'...'}]

        function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
        function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

        function rank(id) {
            let i = PREFERRED.indexOf(id);
            if (i !== -1) return i;
            i = PREFERRED.findIndex(p => id.includes(p));
            return i === -1 ? 99 : i + 0.5;
        }

        /* ---------- Conversation log ---------- */
        function addMsg(role, text) {
            const log = $('log');
            const div = document.createElement('div');
            div.className = 'msg ' + (role === 'user' ? 'user' : 'jarvis');
            const who = document.createElement('span');
            who.className = 'who';
            who.textContent = role === 'user' ? 'YOU' : 'JARVIS';
            const body = document.createElement('span');
            body.className = 'body';
            body.textContent = text;
            div.appendChild(who);
            div.appendChild(body);
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
            return body;
        }

        function clearChat() {
            history = [];
            stopSpeaking();
            $('log').innerHTML = '';
            addMsg('assistant', 'Memory cleared. Awaiting input...');
        }

        /* ---------- Models ---------- */
        async function loadModels() {
            const apiKey = $('apiKey').value.trim();
            if (!apiKey) return;
            $('status').innerText = 'Loading models...';
            try {
                const r = await fetch(`${API}/models`, { headers: { Authorization: `Bearer ${apiKey}` } });
                const data = await r.json();
                if (!r.ok) throw new Error(data.error?.message || 'Could not load models');

                models = (data.data || [])
                    .filter(m => m.active !== false && !NON_CHAT.test(m.id))
                    .map(m => m.id)
                    .sort((a, b) => (rank(a) - rank(b)) || a.localeCompare(b));
