<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Brain Online</title>
    <style>
        body { background-color: #0b0f19; color: #00f0ff; font-family: monospace; text-align: center; padding: 30px; }
        input, button { padding: 12px; margin: 10px; background: #111; color: #00f0ff; border: 2px solid #00f0ff; font-family: monospace; width: 80%; max-width: 400px; }
        button { cursor: pointer; font-weight: bold; width: auto; padding: 12px 25px; }
        #response { text-align: left; background: #05070c; padding: 15px; border: 1px solid #00f0ff; margin-top: 20px; border-radius: 5px; white-space: pre-wrap; color: #fff; }
    </style>
</head>
<body>
    <h1>J.A.R.V.I.S. - Brain Online</h1>
    <p>Status: <span id="status">Ready</span></p>
    
    <input type="password" id="apiKey" placeholder="Enter Gemini API Key"><br>
    <input type="text" id="prompt" placeholder="Ask Jarvis anything..."><br>
    <button onclick="sendToJarvis()">Send Request</button>
    
    <h3>Response:</h3>
    <div id="response" style="max-width: 400px; margin: 0 auto;">Awaiting input...</div>

    <script>
        async function sendToJarvis() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const resBox = document.getElementById('response');
            
            if(!apiKey) {
                alert("Please enter your Gemini API Key first, Boss!");
                return;
            }
            if(!prompt) {
                alert("Please type a prompt for Jarvis!");
                return;
            }
            
            resBox.innerText = "Thinking...";
            
            try {
                // Using stable gemini-2.0-flash model endpoint
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });
                
                const data = await response.json();
                
                if(data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                    resBox.innerText = data.candidates[0].content.parts[0].text;
                } else if(data.error) {
                    resBox.innerText = "API Error: " + data.error.message;
                } else {
                    resBox.innerText = "Response: " + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                resBox.innerText = "Network Error: " + error.message;
            }
        }
    </script>
</body>
</html>
