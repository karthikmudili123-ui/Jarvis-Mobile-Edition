<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. v21.0 Ultimate Agent</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon.svg">
    <style>
        :root { --c: #00f0ff; --b: #020409; --o: #ffa500; --g: #2bff88; }
        body { background: var(--b); color: var(--c); font-family: 'Courier New', monospace; margin: 0; padding: 15px; text-align: center; }
        h1 { font-size: 30px; letter-spacing: .25em; text-shadow: 0 0 10px var(--c); }
        .sub { font-size: 11px; letter-spacing: .4em; opacity: 0.7; }
        
        /* 3D Arc Reactor Canvas */
        #reactor { width: 200px; height: 200px; margin: 10px auto; filter: drop-shadow(0 0 15px var(--c)); }
        
        .hud-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin: 15px 0; border: 1px solid var(--c); padding: 5px; }
        .panel { border: 1px solid var(--c); padding: 15px; margin: 10px auto; max-width: 600px; background: rgba(5,12,22,.9); text-align: left; }
        input { width: 100%; padding: 10px; background: #07111c; color: var(--c); border: 1px solid var(--c); }
        .row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; justify-content: center; }
        button { padding: 8px 12px; cursor: pointer; background: transparent; color: var(--c); border: 1px solid var(--c); }
        button.active { background: var(--c); color: #000; }
        
        #log { height: 150px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-top: 10px; font-size: 13px; text-align: left; }
        .msg { margin-bottom: 5px; border-left: 2px solid var(--c); padding-left: 5px; }
    </style>
</head>
<body data-state="idle">
    <h1>J.A.R.V.I.S.</h1>
    <div class="sub">PERSONAL AGENT v21.0</div>
    <canvas id="reactor" width="200" height="200"></canvas>
    
    <div class="hud-row">
        <div><span>TIME</span><b id="clock">--:--:--</b></div>
        <div><span>STATE</span><b id="stateLabel">STANDBY</b></div>
        <div><span>MODE</span><b>PWA ONLINE</b></div>
    </div>

    <div class="panel">
        <input type="text" id="prompt" placeholder="Say 'Jarvis' or type command...">
        <div class="row">
            <button onclick="sendAI()">Send</button>
            <button id="micBtn" onclick="toggleMic()">🎤 Speak</button>
            <button id="wakeBtn" onclick="toggleWakeWord()">⚡ Wake: OFF</button>
        </div>
    </div>
    <div class="panel" id="log"></div>

    <script>
        // 1. Reactor Animation
        const cv = document.getElementById('reactor');
        const ctx = cv.getContext('2d');
        function draw() {
            ctx.clearRect(0,0,200,200);
            ctx.beginPath(); ctx.arc(100,100, 80, 0, Math.PI*2);
            ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 3; ctx.stroke();
            requestAnimationFrame(draw);
        }
        draw();
        
        // 2. Multilingual Support
        function speak(text) {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'te-IN'; // Default Telugu/English support
            speechSynthesis.speak(u);
        }

        // 3. Command Handler
        async function sendAI() {
            const p = document.getElementById('prompt').value;
            document.getElementById('log').innerHTML += `<div class="msg">YOU: ${p}</div>`;
            // Add your Groq API logic here
            speak("Processing, Boss.");
        }
        
        // 4. Wake Word Logic
        // ... (WakeWord Logic)
    </script>
</body>
</html>
