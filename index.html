<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Personal AI Agent v19.0</title>
    <!-- [PWA Meta tags & CSS same as before, simplified for reliability] -->
    <style>
        :root { --c: #00f0ff; --o: #ffa500; --g: #2bff88; --r: #ff5555; }
        body { background: #020409; color: var(--c); font-family: 'Courier New', monospace; margin: 0; padding: 20px; text-align: center; }
        canvas { width: 220px; height: 220px; }
        .panel { border: 1px solid var(--c); padding: 15px; margin: 20px auto; max-width: 600px; background: rgba(5,12,22,.8); }
        input, select { width: 100%; padding: 10px; margin: 5px 0; background: #07111c; color: var(--c); border: 1px solid var(--c); }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; background: transparent; color: var(--c); border: 1px solid var(--c); }
        button.active { background: var(--c); color: #020409; }
        #log { text-align: left; height: 200px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-top: 10px; font-size: 13px; }
        .msg { margin-bottom: 8px; border-left: 2px solid var(--c); padding-left: 5px; }
    </style>
</head>
<body data-state="idle">
    <h1>J.A.R.V.I.S.</h1>
    <canvas id="reactor"></canvas>
    <div id="status">Status: Ready</div>
    
    <div class="panel">
        <input type="password" id="apiKey" placeholder="Enter Groq API Key">
        <input type="text" id="prompt" placeholder="Say 'Jarvis' or type command...">
        <div class="row">
            <button onclick="toggleMic()">🎤 Mic: OFF</button>
            <button onclick="sendToJarvis()">Send</button>
        </div>
    </div>

    <div class="panel" id="log"></div>

    <script>
        const $ = id => document.getElementById(id);
        let state = 'idle';
        
        // Always-on Speech Recognition
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        let rec = null;

        function startContinuousListening() {
            if (!SR) return;
            rec = new SR();
            rec.continuous = true;
            rec.interimResults = false;
            rec.lang = 'en-IN'; // Multi-lingual setup

            rec.onstart = () => { state = 'listening'; $('status').innerText = 'Status: Listening...'; };
            rec.onresult = (e) => {
                const text = e.results[e.results.length - 1][0].transcript.toLowerCase();
                if (text.includes('jarvis')) {
                    addMsg('user', text);
                    processCommand(text);
                }
            };
            rec.onend = () => { 
                if (state !== 'speaking') setTimeout(() => rec.start(), 500); // Auto-restart
            };
            rec.start();
        }

        function processCommand(text) {
            // Task Logic (Reminders, Weather, etc.)
            if(text.includes('weather')) {
                speak('Fetching weather data, Boss.');
                // ... fetch logic ...
            }
            // Add other task logic here (Gmail, WhatsApp URLs)
        }

        // Voice Feedback
        function speak(text) {
            state = 'speaking';
            const u = new SpeechSynthesisUtterance(text);
            u.onend = () => { state = 'idle'; };
            speechSynthesis.speak(u);
        }

        function addMsg(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            div.textContent = role.toUpperCase() + ': ' + text;
            $('log').appendChild(div);
        }

        // Boot
        startContinuousListening();
    </script>
</body>
</html>
