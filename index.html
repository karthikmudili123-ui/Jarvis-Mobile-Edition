<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Test - Brain Online</title>
    <style>
        body { background-color: #0b0f19; color: #00f0ff; font-family: monospace; text-align: center; padding-top: 50px; }
        input, button { padding: 10px; margin: 10px; background: #111; color: #00f0ff; border: 1px solid #00f0ff; font-family: monospace; }
        button { cursor: pointer; }
    </style>
</head>
<body>
    <h1>J.A.R.V.I.S. - Brain Online</h1>
    <p>Status: <span id="status">Ready</span></p>
    
    <!-- Gemini API Key input box -->
    <input type="password" id="apiKey" placeholder="Enter Gemini API Key" style="width: 250px;"><br>
    
    <!-- User Prompt Input -->
    <input type="text" id="prompt" placeholder="Ask Jarvis anything..." style="width: 250px;"><br>
    
    <button onclick="sendToJarvis()">Send Request</button>
    
    <h3>Response:</h3>
    <p id="response" style="color: #fff; max-width: 400px; margin: 0 auto;"></p>

    <script>
        async function sendToJarvis() {
            const apiKey = document.getElementById('apiKey').value;
            const prompt = document.getElementById('prompt').value;
            const resBox = document.getElementById('response');
            
            if(!apiKey) {
                alert("Please enter your Gemini API Key first, Boss!");
                return;
            }
            
            resBox.innerText = "Thinking...";
            
            try {
                // Updated to gemini-2.5-flash model endpoint
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });
                
                const data = await response.json();
                
                if(data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    resBox.innerText = reply;
                } else if(data.error) {
                    resBox.innerText = "API Error: " + data.error.message;
                } else {
                    resBox.innerText = "Response: " + JSON.stringify(data);
                }
            } catch (error) {
                resBox.innerText = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
